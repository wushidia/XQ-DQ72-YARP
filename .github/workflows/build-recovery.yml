name: Build Xperia 1 V GUI2 recovery

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Build jobs (1-4; 2 is recommended for a private-repository runner)"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

concurrency:
  group: xperia-1v-recovery
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: /home/runner/twrp-source
      ARTIFACT_DIR: /home/runner/twrp-artifacts
      BUILD_JOBS: ${{ inputs.jobs }}
      ALLOW_MISSING_DEPENDENCIES: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare disk, swap and build dependencies
        run: bash scripts/setup-runner.sh
      - name: Fetch Android and Sony source metadata
        run: bash scripts/sync.sh metadata
      - name: Upload source metadata diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-source-metadata-${{ github.run_number }}
          path: /home/runner/twrp-artifacts/*.log
          retention-days: 14
      - name: Checkout Android sources and selected Linux prebuilts
        run: bash scripts/sync.sh checkout
      - name: Merge GUI2 PR 31 and adapt the device tree
        run: bash scripts/prepare-source.sh
      - name: Free duplicate prebuilt blobs and reserve build space
        run: bash scripts/prepare-build-space.sh
      - name: Build and verify recovery.img (attempt 1)
        id: build_1
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 1)
        if: steps.build_1.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-1
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 2)
        id: repair_2
        if: steps.build_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 2
      - name: Build and verify recovery.img (attempt 2)
        id: build_2
        if: steps.build_1.outcome == 'failure' && steps.repair_2.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 2)
        if: steps.build_2.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-2
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 3)
        id: repair_3
        if: steps.build_2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 3
      - name: Build and verify recovery.img (attempt 3)
        id: build_3
        if: steps.build_2.outcome == 'failure' && steps.repair_3.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 3)
        if: steps.build_3.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-3
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 4)
        id: repair_4
        if: steps.build_3.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 4
      - name: Build and verify recovery.img (attempt 4)
        id: build_4
        if: steps.build_3.outcome == 'failure' && steps.repair_4.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 4)
        if: steps.build_4.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-4
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 5)
        id: repair_5
        if: steps.build_4.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 5
      - name: Build and verify recovery.img (attempt 5)
        id: build_5
        if: steps.build_4.outcome == 'failure' && steps.repair_5.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 5)
        if: steps.build_5.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-5
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 6)
        id: repair_6
        if: steps.build_5.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 6
      - name: Build and verify recovery.img (attempt 6)
        id: build_6
        if: steps.build_5.outcome == 'failure' && steps.repair_6.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 6)
        if: steps.build_6.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-6
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 7)
        id: repair_7
        if: steps.build_6.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 7
      - name: Build and verify recovery.img (attempt 7)
        id: build_7
        if: steps.build_6.outcome == 'failure' && steps.repair_7.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Upload failure logs (attempt 7)
        if: steps.build_7.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-diagnostics-${{ github.run_number }}-attempt-7
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14
      - name: Wait for source repair (attempt 8)
        id: repair_8
        if: steps.build_7.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-repair.sh 8
      - name: Build and verify recovery.img (attempt 8)
        id: build_8
        if: steps.build_7.outcome == 'failure' && steps.repair_8.outcome == 'success'
        continue-on-error: true
        run: bash scripts/build.sh
      - name: Require a verified successful build
        run: test -f "$ARTIFACT_DIR/build-success"
      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-XQ-DQ72-GUI2-${{ github.run_number }}
          path: |
            /home/runner/twrp-artifacts/recovery.img
            /home/runner/twrp-artifacts/SHA256SUMS
            /home/runner/twrp-artifacts/build-info.txt
            /home/runner/twrp-artifacts/source-manifest.xml
            /home/runner/twrp-artifacts/recovery-header.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload build logs and source adjustments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            /home/runner/twrp-artifacts/*.log
            /home/runner/twrp-artifacts/*.patch
            /home/runner/twrp-artifacts/build-info.txt
            /home/runner/twrp-artifacts/source-manifest.xml
            /home/runner/twrp-artifacts/recovery-header.txt
          if-no-files-found: warn
          retention-days: 14
