name: Build Xperia 1 V GUI2 recovery

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Build jobs (2 recommended for the private-repository runner)"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-recovery.yml"
      - "config/**"
      - "manifests/**"
      - "overlays/**"
      - "patches/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: xperia-1v-recovery-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout release configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate pinned source and build scripts
        run: python3 scripts/verify-project.py
      - name: Test logger defaults, persistence, pause and resume
        run: python3 tests/logging-control-test.py

  recovery:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}/.work/source
      ARTIFACT_DIR: ${{ github.workspace }}/.work/artifacts
      BUILD_JOBS: ${{ inputs.jobs }}
      ALLOW_MISSING_DEPENDENCIES: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      GOMAXPROCS: "2"
      GOGC: "50"
      SOONG_GOMEMLIMIT: "6GiB"
      GOMEMLIMIT: "6GiB"
      RUN_INSTALLCLEAN: "1"
    steps:
      - name: Checkout release configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare disk, swap and dependencies
        run: bash scripts/setup-runner.sh
      - name: Fetch pinned Android and Sony source metadata
        run: bash scripts/sync.sh metadata
      - name: Checkout source and release duplicate blobs
        run: bash scripts/sync.sh checkout
      - name: Merge GUI2 and apply the verified final release
        run: bash scripts/prepare-source.sh
      - name: Reserve compilation space
        run: bash scripts/prepare-build-space.sh
      - name: Build and validate recovery.img
        run: bash scripts/build.sh
      - name: Upload final recovery image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-XQ-DQ72-GUI2-final-${{ github.run_number }}
          path: |
            ${{ env.ARTIFACT_DIR }}/recovery.img
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
            ${{ env.ARTIFACT_DIR }}/recovery-header.txt
            ${{ env.ARTIFACT_DIR }}/build-info.txt
            ${{ env.ARTIFACT_DIR }}/source-manifest.xml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Xperia-1V-build-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARTIFACT_DIR }}/*.log
            ${{ env.ARTIFACT_DIR }}/build-info.txt
            ${{ env.ARTIFACT_DIR }}/source-manifest.xml
            ${{ env.ARTIFACT_DIR }}/recovery-header.txt
          if-no-files-found: warn
          retention-days: 14
